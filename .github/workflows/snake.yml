# Змейка ест граф контрибьюшенов. Перерисовывается каждый день и кладётся в ветку output.
name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#1f2335,#2e3c64,#3d59a1,#7aa2f7,#7dcfff
            dist/snake-light.svg?color_snake=#7aa2f7&color_dots=#ebedf0,#c6d3f5,#9fb4f0,#7aa2f7,#3d59a1

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
